# Build the installers, gate them, and publish a release.
#
# Never on push. The repository is private until v1.0.0 and Actions minutes on a
# private repository are metered, so this runs on a version tag or when someone
# asks for it by hand. PLAN section 11.
#
# Everything large is fetched by pinned checksum rather than committed: the
# sidecar from llama.cpp's release b10639, the embedding model from the model's
# own host, and index.db from this repository's index-0.2.0 prerelease, which
# exists because the index is 366.8 MB and git cannot carry it.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the plumbing without bundling installers"
        type: boolean
        default: false
      publish:
        description: "Publish a GitHub release from the artifacts"
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Pinned in tools/fetch_llama.py, docs/SIDECAR.md and NOTICE.md as well.
  INDEX_TAG: index-0.2.0
  INDEX_SHA256: d3b0579281b6a5044b6f59a0e50ec3424ef3fc25dac43042d5c8168cb29bec58
  INDEX_BYTES: "384614400"
  CARGO_TERM_COLOR: always

jobs:
  # --------------------------------------------------------------- version
  # A release must move forward. The version lives in src-tauri/Cargo.toml and
  # nowhere else: tauri.conf.json has no version key, so Tauri falls back to the
  # Cargo one and the installer and the About screen cannot disagree, which they
  # did until 2026-08-27.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.read.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - id: read
        shell: bash
        run: |
          v=$(grep -m1 '^version = ' src-tauri/Cargo.toml | cut -d'"' -f2)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "version in src-tauri/Cargo.toml: $v"

      - name: the version must be greater than the latest published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ steps.read.outputs.version }}"
          # What counts as released is what has actually been released. A tag is
          # not a release, and the tag being built is in this very checkout, so
          # reading tags made the gate compare the candidate against itself:
          # tagging v1.0.0 failed with "version 1.0.0 is already released".
          #
          # P6 believed it had fixed this. Its fix filtered the tag list down to
          # plain vX.Y.Z, which excluded the test tag v0.9.1-ci that every P6 run
          # used -- and so excluded the only tag those runs could have collided
          # with. The first tag that was itself a plain vX.Y.Z was the first real
          # release, which is where it surfaced. A gate exercised only by a tag
          # shaped unlike a release was never exercised.
          #
          # Drafts are not published, and the run that creates one must be able
          # to run again after a failed candidate's draft is deleted and the tag
          # remade, which is P7's fail path. So drafts are excluded here, exactly
          # as the upgrade gate below excludes them.
          #
          # The braces keep a grep that matches nothing from killing the step:
          # pipefail plus set -e makes "no releases yet" look like a failure.
          latest=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 \
                     --json tagName --jq '.[].tagName' \
                   | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } | sed 's/^v//' | sort -V | tail -1)
          if [ -z "$latest" ]; then
            echo "no published release yet; $v is the first"
            exit 0
          fi
          echo "latest published: $latest, this build: $v"
          if [ "$v" = "$latest" ]; then
            echo "::error::version $v is already released"
            exit 1
          fi
          top=$(printf '%s\n%s\n' "$v" "$latest" | sort -V | tail -1)
          if [ "$top" != "$v" ]; then
            echo "::error::version $v is lower than the released $latest"
            exit 1
          fi

      - name: a pushed tag must match the version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          v="${{ steps.read.outputs.version }}"
          # A -ci suffix marks a test tag; the numbers still have to match.
          if [ "${tag%%-*}" != "$v" ]; then
            echo "::error::tag v$tag does not match version $v"
            exit 1
          fi

  # ----------------------------------------------------------- offline gate
  # The promise is that the app never reaches the network once its models are
  # in place. This runs the query suite with the network taken away, and proves
  # the network really is gone by asserting the downloader fails.
  offline:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: fetch index.db by pinned checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INDEX_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern index.db --dir src-tauri/resources
          echo "$INDEX_SHA256  src-tauri/resources/index.db" | sha256sum -c -

      - name: fetch the embedding model by pinned checksum
        run: python3 tools/fetch_model.py

      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri/core" }

      # The query suite: everything that does not need a chat model. The two
      # lifecycle suites drive a real llama-server with a 4.7 GB model and fail
      # loudly rather than skip when it is absent, which is right on a
      # developer's machine and wrong on a runner that should never download
      # five gigabytes. They are run by hand; docs/HANDOFF.md says so.
      - name: build the tests while the network is still here
        run: |
          cargo test --manifest-path src-tauri/core/Cargo.toml --no-run --locked             --lib --test book_names --test builtin --test bundled_model --test chapter --test credits --test crisis             --test download --test hardware_screen --test low_memory --test prompts_and_output --test retrieval_parity             --test spreadsheet --test userdb --test verifier_parity

      - name: run the suite with no network
        shell: bash
        run: |
          # unshare gives the step a network namespace holding only loopback,
          # which is what the tests' own HTTP server needs and all it needs.
          # Anything reaching outward has nowhere to go.
          #
          # The namespace is entered as root, because creating one needs to be;
          # the tests are then run back as the runner's own user, so that
          # rustup, the cargo home and the build cache are the ones the earlier
          # step filled. Running them as root instead finds no toolchain at all.
          CARGO="$(command -v cargo)"
          sudo unshare --net -- bash -c "
            ip link set lo up
            exec sudo -u '$USER' \
              env PATH='$PATH' HOME='$HOME' CARGO_HOME='${CARGO_HOME:-$HOME/.cargo}' \
                  RUSTUP_HOME='${RUSTUP_HOME:-$HOME/.rustup}' CARGO_TERM_COLOR=always \
              '$CARGO' test --manifest-path src-tauri/core/Cargo.toml --locked                 --lib --test book_names --test builtin --test bundled_model --test chapter --test credits --test crisis                 --test download --test hardware_screen --test low_memory --test prompts_and_output --test retrieval_parity                 --test spreadsheet --test userdb --test verifier_parity
          "

      - name: prove the network really was gone
        shell: bash
        run: |
          # A gate that quietly had a network would be worse than no gate, so
          # the same namespace is asked to reach the model host and must fail.
          set +e
          sudo unshare --net -- bash -c \
            'ip link set lo up; curl -sS --max-time 15 https://huggingface.co > /dev/null'
          rc=$?
          # And loopback must still work, or the suite above proved nothing
          # either: it would have passed by having no server to talk to.
          sudo unshare --net -- bash -c \
            'ip link set lo up; timeout 5 bash -c "cat < /dev/null > /dev/tcp/127.0.0.1/1" 2>/dev/null; exit 0'
          lo=$?
          set -e
          if [ $rc -eq 0 ]; then
            echo "::error::the offline job reached the internet, so it proves nothing"
            exit 1
          fi
          echo "the model host was unreachable inside the namespace (curl exit $rc), as it must be"
          echo "loopback was still usable (exit $lo)"

  # --------------------------------------------------------------- installers
  build:
    needs: [version, offline]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: nsis
            artifact: windows-installer
          - os: ubuntu-22.04
            bundles: deb,appimage
            artifact: linux-installers
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev

      - name: fetch index.db by pinned checksum
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INDEX_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern index.db --dir src-tauri/resources
          echo "$INDEX_SHA256  src-tauri/resources/index.db" | sha256sum -c -
          test "$(wc -c < src-tauri/resources/index.db)" = "$INDEX_BYTES"

      - name: fetch the embedding model by pinned checksum
        shell: bash
        run: python3 tools/fetch_model.py || python tools/fetch_model.py

      - name: fetch and assemble the sidecar by pinned checksum
        shell: bash
        run: python3 tools/fetch_llama.py --bundle || python tools/fetch_llama.py --bundle

      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }

      - name: check the frontend
        run: npm run build && npx vitest run

      - name: build the installers
        if: ${{ !inputs.dry_run }}
        run: npx tauri build --bundles ${{ matrix.bundles }}

      - name: checksum what was produced
        if: ${{ !inputs.dry_run }}
        shell: bash
        run: |
          mkdir -p out
          find src-tauri/target/release/bundle -type f \
            \( -name '*.exe' -o -name '*.deb' -o -name '*.AppImage' \) -print0 |
            xargs -0 -I{} cp {} out/
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        if: ${{ !inputs.dry_run }}
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          retention-days: 7


  # ------------------------------------------------------------------- macOS
  # Added in P-MAC. Two chips, two disk images, no universal binary: a universal
  # .app would carry two model servers and two sets of libraries and make every
  # reader download the half they cannot run.
  #
  # Everything runnable is proven here, because there is no Mac in this project.
  # Everything visual -- the disk image window, the Gatekeeper dialogs, the app's
  # own screens -- is unseen, and README says so in those words.
  #
  # Intel is built and tested natively: `macos-15-intel` is a current hosted
  # runner, so nothing is cross-compiled and no Rosetta is involved.
  macos:
    needs: [version, offline]
    if: ${{ !inputs.dry_run }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            chip: aarch64
            chip_name: Apple Silicon
            artifact: macos-apple-silicon-installer
          - os: macos-15-intel
            chip: x64
            chip_name: Intel
            artifact: macos-intel-installer
    runs-on: ${{ matrix.os }}
    env:
      APP: src-tauri/target/release/bundle/macos/The Pastor Bible.app
      # The smaller answering model. Pinned in src-tauri/core/src/download.rs
      # and repeated here; the checksum is the point, not the copy.
      SMALL_MODEL: Qwen3-1.7B-Q8_0.gguf
      SMALL_MODEL_URL: https://huggingface.co/Qwen/Qwen3-1.7B-GGUF/resolve/main/Qwen3-1.7B-Q8_0.gguf
      SMALL_MODEL_SHA: 061b54daade076b5d3362dac252678d17da8c68f07560be70818cace6590cb1a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm }

      - name: which Mac is this, exactly
        run: |
          sw_vers
          uname -m
          echo "runner label: ${{ matrix.os }}, expected chip: ${{ matrix.chip }}"
          test "$(uname -m)" = "$( [ '${{ matrix.chip }}' = 'aarch64' ] && echo arm64 || echo x86_64 )" \
            || { echo "::error::this runner is not the chip this job is for"; exit 1; }

      - name: fetch index.db by pinned checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$INDEX_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern index.db --dir src-tauri/resources
          echo "$INDEX_SHA256  src-tauri/resources/index.db" | shasum -a 256 -c -
          test "$(wc -c < src-tauri/resources/index.db | tr -d ' ')" = "$INDEX_BYTES"

      - name: fetch the embedding model by pinned checksum
        run: python3 tools/fetch_model.py

      - name: fetch and assemble the sidecar by pinned checksum
        run: |
          python3 tools/fetch_llama.py --bundle
          ls -la src-tauri/resources/llama/
          # No symlinks: fetch_llama.py resolves them and writes real bytes
          # under the names the binaries ask for, because nothing here can test
          # whether Tauri's resource copying would preserve a link.
          if find src-tauri/resources/llama -type l | grep .; then
            echo "::error::a symlink reached the bundle"; exit 1
          fi

      - name: the model server starts, and what it can see on this Mac
        run: |
          # Two separate questions, kept apart because the first CI run of this
          # phase ran them together and reported "no Metal device" for a server
          # that had not started at all.
          #
          # First: does it run? On 2026-09-01 b10639's Apple Silicon build did
          # not. dyld refused it over a hard link on /usr/lib/librdma.dylib,
          # which does not exist before macOS 26, and that is why the macOS
          # assets are pinned to b10694. A non-zero exit here is that class of
          # failure and must stop the build.
          set +e
          ./src-tauri/resources/llama/llama-server --list-devices > devices.txt 2>&1
          rc=$?
          set -e
          cat devices.txt
          if [ $rc -ne 0 ]; then
            echo "::error::llama-server exited $rc. It did not start; the lines above say why."
            exit 1
          fi

          # Second: what did it report? On Intel this is an assertion, because
          # the x64 archive contains no Metal backend at all and a Metal device
          # appearing would mean docs/SIDECAR.md is wrong about what shipped.
          #
          # On Apple Silicon it is recorded and not asserted. This runner is a
          # virtual machine, and whether a Metal device appears inside one says
          # nothing about whether one appears on a pastor's MacBook. What the
          # app does when no device is reported is what it does on a Windows
          # laptop without a card, which is tested; what it says when one is
          # reported has unit tests over the parsed output.
          if [ "${{ matrix.chip }}" = "aarch64" ]; then
            if grep -qi metal devices.txt; then
              echo "this Apple Silicon runner reports a Metal device, printed above"
            else
              echo "::warning::no Metal device on this Apple Silicon runner, which is a virtual machine. Recorded, not asserted; the answer for real hardware is unverified."
            fi
          else
            if grep -qi metal devices.txt; then
              echo "::error::the Intel build reported a Metal device; docs/SIDECAR.md is wrong"
              exit 1
            fi
            echo "no Metal device, which is what the x64 archive's own contents require"
          fi

      - run: npm ci
      - uses: Swatinem/rust-cache@v2
        with: { workspaces: "src-tauri" }

      - name: check the frontend
        run: npm run build && npx vitest run

      - name: cargo test
        run: |
          cargo test --manifest-path src-tauri/core/Cargo.toml --locked \
            --lib --test book_names --test builtin --test bundled_model --test chapter \
            --test credits --test crisis --test download --test hardware_screen \
            --test low_memory --test prompts_and_output --test retrieval_parity \
            --test spreadsheet --test userdb --test verifier_parity

      - name: the "This computer" screen, against this Mac's real server
        run: |
          # `probe_against_the_real_server` is ignored by default because it
          # needs the sidecar. Here the sidecar exists, so it runs: it asks the
          # real llama-server what it can see and checks what the reader would
          # be told about it. On Intel that is an assertion -- the x64 build
          # reports "BLAS: Accelerate (0 MiB, 0 MiB free)" and Accelerate is the
          # processor, not a card, so nothing about it may reach the screen.
          cargo test --manifest-path src-tauri/core/Cargo.toml --locked \
            --test hardware_screen -- --ignored --nocapture --test-threads 1

      - name: no llama-server survives its parent, including a hard kill
        run: |
          # The same test as on Windows and Linux. On macOS the mechanism is a
          # pipe and /bin/sh rather than a Job Object or PR_SET_PDEATHSIG, and
          # this is what proves it works. It drives a real server against the
          # 274 MB search model, not the 4.7 GB one.
          cargo test --manifest-path src-tauri/core/Cargo.toml --locked \
            --test sidecar_lifecycle -- --nocapture --test-threads 1

      - name: build the .app
        run: npx tauri build --bundles app

      - name: what Tauri actually signed
        run: |
          # Not a screenshot and not a guess: the assessment macOS itself makes
          # of this bundle, with the quarantine flag a download would carry.
          # Whatever it says goes into the release notes and README.
          codesign -dvvv "$APP" 2>&1 || true
          echo "--- verify ---"
          codesign --verify --verbose=2 "$APP" 2>&1 || true
          echo "--- with the quarantine flag a downloaded copy would carry ---"
          rm -rf /tmp/quarantined && mkdir -p /tmp/quarantined
          ditto "$APP" "/tmp/quarantined/The Pastor Bible.app"
          xattr -w com.apple.quarantine \
            "0083;00000000;Safari;|io.github.haomuch1.pastorbible" \
            "/tmp/quarantined/The Pastor Bible.app"
          spctl --assess --type execute -vvv "/tmp/quarantined/The Pastor Bible.app" 2>&1 || true
          echo "(a rejection here is expected and is the whole reason READ-ME-FIRST.rtf exists)"

      - name: build the disk image
        run: |
          mkdir -p out
          bash tools/make_dmg.sh "$APP" \
            "out/The Pastor Bible_${{ needs.version.outputs.version }}_${{ matrix.chip }}.dmg"

      - name: the disk image holds the three things it is supposed to
        run: |
          DMG="out/The Pastor Bible_${{ needs.version.outputs.version }}_${{ matrix.chip }}.dmg"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint /tmp/dmg >/dev/null
          ls -la /tmp/dmg
          test -d "/tmp/dmg/The Pastor Bible.app"   || { echo "::error::no app in the image"; exit 1; }
          test -L "/tmp/dmg/Applications"           || { echo "::error::no Applications link"; exit 1; }
          test -f "/tmp/dmg/READ-ME-FIRST.rtf"      || { echo "::error::no READ ME FIRST"; exit 1; }
          test -f "/tmp/dmg/.background/background.png" \
            || echo "::warning::the background picture is not in the image"
          echo "READ-ME-FIRST.rtf is $(wc -c < /tmp/dmg/READ-ME-FIRST.rtf | tr -d ' ') bytes"
          # Out of the image and into Applications, exactly as a reader would.
          rm -rf "/tmp/Applications-stand-in" && mkdir -p "/tmp/Applications-stand-in"
          ditto "/tmp/dmg/The Pastor Bible.app" "/tmp/Applications-stand-in/The Pastor Bible.app"
          hdiutil detach /tmp/dmg >/dev/null

      - name: the app that came out of the image starts and finds everything
        run: |
          # Its own binary, run directly, with no window and no display. This is
          # the check P7's laptop needed and did not have.
          "/tmp/Applications-stand-in/The Pastor Bible.app/Contents/MacOS/pastor-bible" --self-check
          echo "--- where it keeps the reader's data ---"
          ls -la "$HOME/Library/Application Support/io.github.haomuch1.pastorbible/"

      - name: fetch the smaller answering model by pinned checksum
        run: |
          mkdir -p "$RUNNER_TEMP/models"
          curl -sSL -o "$RUNNER_TEMP/models/$SMALL_MODEL" "$SMALL_MODEL_URL"
          echo "$SMALL_MODEL_SHA  $RUNNER_TEMP/models/$SMALL_MODEL" | shasum -a 256 -c -

      - name: one real question, end to end, through the app's own resources
        run: |
          # g01 from data/eval/questions.json -- a graded question with an
          # approved gold list, not one written for this test. Everything large
          # comes out of the .app that was copied from the disk image: its
          # index.db, its search model, its model server. The harness is the
          # CLI, because the shipped binary is a window and a runner has none.
          RES="/tmp/Applications-stand-in/The Pastor Bible.app/Contents/Resources/resources"
          export TPB_INDEX_DB="$RES/index.db"
          export TPB_EMBED_MODEL="$RES/nomic-embed-text-v1.5-f16.gguf"
          export TPB_LLAMA_SERVER="$RES/llama/llama-server"
          export TPB_MODEL_DIR="$RUNNER_TEMP/models"
          ls -la "$RES" "$RES/llama"
          time cargo run --release --manifest-path src-tauri/core/Cargo.toml --locked \
            --bin pastor-bible-cli -- \
            ask "What does the Bible say about anxiety and worry?" \
            --model fallback --json answer.json

      - name: the answer was verified and nothing was fabricated
        run: |
          python3 - <<'PY'
          import json, sys
          a = json.load(open('answer.json'))
          bad = []
          if a.get('verdict') != 'ok':
              bad.append('verdict is %r, not ok' % a.get('verdict'))
          if not a.get('synopsis_markdown'):
              bad.append('no verified synopsis was produced')
          if a.get('fallback_used'):
              bad.append('the passage-list fallback was used, so no summary was verified')
          for i, at in enumerate(a.get('attempts', [])):
              if at.get('violations'):
                  bad.append('attempt %d had %d violation(s): %r'
                             % (i, len(at['violations']), at['violations'][:3]))
          if not a.get('cited_passage_ids'):
              bad.append('the answer cited nothing')

          gen = a['timings']['generate_seconds']
          toks = None
          for at in a.get('attempts', []):
              if at.get('completion_tokens'):
                  toks = at['completion_tokens']
          print('verdict            %s' % a.get('verdict'))
          print('passages retrieved %d, cited %d'
                % (len(a.get('passages', [])), len(a.get('cited_passage_ids', []))))
          print('sidecar path       %s' % a.get('sidecar_path'))
          print('model              %s' % a.get('model_id'))
          print('generate seconds   %.1f' % gen)
          if toks and gen > 0:
              print('TOKENS PER SECOND  %.2f  (%d completion tokens)' % (toks / gen, toks))
          else:
              print('TOKENS PER SECOND  not reported by the server')
          print('total seconds      %.1f' % a['timings']['total_seconds'])
          if bad:
              for b in bad:
                  print('::error::%s' % b)
              sys.exit(1)
          print('a verified answer, zero fabrications')
          PY

      - name: the reader's data survives replacing the app
        run: |
          # A macOS upgrade is dragging a new .app over an old one. Nothing
          # asks, nothing migrates; what has to be true is that the reader's
          # questions are still there afterwards.
          DATA="$HOME/Library/Application Support/io.github.haomuch1.pastorbible"
          mkdir -p "$DATA/models"
          printf 'not a real database, but it belongs to the reader' > "$DATA/user.db"
          printf 'stand-in for two gigabytes' > "$DATA/models/$SMALL_MODEL"
          BEFORE=$(shasum -a 256 < "$DATA/user.db")

          rm -rf "/tmp/Applications-stand-in/The Pastor Bible.app"
          DMG="out/The Pastor Bible_${{ needs.version.outputs.version }}_${{ matrix.chip }}.dmg"
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint /tmp/dmg2 >/dev/null
          ditto "/tmp/dmg2/The Pastor Bible.app" "/tmp/Applications-stand-in/The Pastor Bible.app"
          hdiutil detach /tmp/dmg2 >/dev/null

          test -f "$DATA/user.db" || { echo "::error::replacing the app deleted the history"; exit 1; }
          AFTER=$(shasum -a 256 < "$DATA/user.db")
          test "$BEFORE" = "$AFTER" || { echo "::error::the history changed"; exit 1; }
          grep -q "the reader" "$DATA/user.db" || { echo "::error::the history was overwritten"; exit 1; }
          test -s "$DATA/models/$SMALL_MODEL" || { echo "::error::the model was removed"; exit 1; }
          echo "history and downloaded model both survived the replacement"

          # And the replaced app still starts and still finds its resources.
          "/tmp/Applications-stand-in/The Pastor Bible.app/Contents/MacOS/pastor-bible" --self-check

      - name: checksum what was produced
        run: |
          cd out && shasum -a 256 * > SHA256SUMS.txt && cat SHA256SUMS.txt && ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/*
          retention-days: 7

  # -------------------------------------------------------------- upgrade gate
  # PLAN 11: install the previous release, then this candidate, and assert one
  # install, history preserved, and no model re-download.
  upgrade:
    needs: [version, build]
    if: ${{ !inputs.dry_run }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: windows-installer, path: candidate }

      - name: fetch the previous release, if there is one
        id: prev
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts \
                  --json tagName --jq '[.[] | select(.tagName | startswith("v"))][0].tagName // ""')
          if [ -z "$tag" ]; then
            echo "have_prev=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No previous release exists. The gate runs the candidate twice \
                  instead, which tests reinstall-over-itself but not a version change."
          else
            echo "have_prev=true" >> "$GITHUB_OUTPUT"
            mkdir -p previous
            gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*setup.exe' --dir previous
          fi

      - name: install the earlier build, then the candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function ARP { @(Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" -ErrorAction SilentlyContinue | Where-Object DisplayName -like "*Pastor*") }
          $first = if ("${{ steps.prev.outputs.have_prev }}" -eq "true") {
            (Get-ChildItem previous -Filter *setup.exe | Select-Object -First 1).FullName
          } else {
            (Get-ChildItem candidate -Filter *setup.exe | Select-Object -First 1).FullName
          }
          $cand = (Get-ChildItem candidate -Filter *setup.exe | Select-Object -First 1).FullName

          Start-Process $first -ArgumentList '/S' -Wait
          Start-Sleep 5
          if ((ARP).Count -ne 1) { throw "expected one Add/Remove entry after the first install, found $((ARP).Count)" }
          $before = (ARP).DisplayVersion
          Write-Host "installed $before"

          # Something the reader would lose: a history file and a stand-in model.
          $data = "$env:APPDATA\io.github.haomuch1.pastorbible"
          New-Item -ItemType Directory -Force "$data\models" | Out-Null
          Set-Content "$data\user.db" "not a real database, but it is the reader's"
          Set-Content "$data\models\Qwen3-8B-Q4_K_M.gguf" "stand-in for five gigabytes"
          $modelStamp = (Get-Item "$data\models\Qwen3-8B-Q4_K_M.gguf").LastWriteTimeUtc
          Start-Sleep 2

          Start-Process $cand -ArgumentList '/S' -Wait
          Start-Sleep 5

          if ((ARP).Count -ne 1) { throw "expected ONE Add/Remove entry after the upgrade, found $((ARP).Count)" }
          Write-Host "one Add/Remove entry, now $((ARP).DisplayVersion)"

          if (-not (Test-Path "$data\user.db")) { throw "the upgrade deleted the reader's history" }
          if ((Get-Content "$data\user.db" -Raw) -notmatch "the reader's") { throw "the upgrade overwrote the reader's history" }
          Write-Host "history survived the upgrade"

          $after = (Get-Item "$data\models\Qwen3-8B-Q4_K_M.gguf").LastWriteTimeUtc
          if ($after -ne $modelStamp) { throw "the model was rewritten: $modelStamp -> $after" }
          Write-Host "the model was not re-downloaded"

          $dir = "$env:LOCALAPPDATA\The Pastor Bible"
          Write-Host "install directory holds $((Get-ChildItem $dir -Recurse -File).Count) files"

      - name: a downgrade is refused
        if: ${{ steps.prev.outputs.have_prev == 'true' }}
        shell: pwsh
        run: |
          $prev = (Get-ChildItem previous -Filter *setup.exe | Select-Object -First 1).FullName
          $v = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
                Where-Object DisplayName -like "*Pastor*").DisplayVersion
          $p = Start-Process $prev -ArgumentList '/S' -Wait -PassThru
          $now = (Get-ItemProperty "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*" |
                  Where-Object DisplayName -like "*Pastor*").DisplayVersion
          if ($now -ne $v) { throw "the older installer replaced $v with $now" }
          Write-Host "downgrade refused with exit code $($p.ExitCode); still $now"

  # ------------------------------------------------------------------- signing
  # PLAN 11: present, off, and waiting for SignPath. It is written here so that
  # turning it on is a flag rather than a change to the release process.
  sign:
    needs: build
    if: ${{ vars.SIGNING_ENABLED == 'true' && !inputs.dry_run }}
    runs-on: windows-latest
    steps:
      - run: |
          echo "SignPath's trusted-build integration goes here."
          echo "Until the application is granted, this job does not run."

  # ------------------------------------------------------------------- publish
  publish:
    needs: [version, build, macos, upgrade]
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.publish }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - shell: bash
        run: |
          # Each build job uploaded its own SHA256SUMS.txt inside its artifact.
          # Those are not the published file and must not be copied in: the
          # published one is written here, over all three installers at once.
          mkdir -p release
          find dist -type f ! -name SHA256SUMS.txt -exec cp {} release/ \;
          cd release

          # GitHub replaces spaces in an asset's filename with dots when it is
          # uploaded, so a checksums file naming "The Pastor Bible_..." matches
          # nothing a reader ever downloads: sha256sum -c reports every file
          # missing. Renaming here means the name in the file and the name on
          # the release page are the same name. Found in P7-prep, on v1.0.0.
          for f in *; do
            n="${f// /.}"
            [ "$f" = "$n" ] || mv -- "$f" "$n"
          done

          # Written outside the directory and moved in, so the glob cannot
          # catch the file being written. Generating it in place listed it with
          # the sha256 of an empty file, which is what v1.0.0 shipped.
          sha256sum -- * > ../SHA256SUMS.txt
          mv ../SHA256SUMS.txt .
          ls -la
          echo "--- SHA256SUMS.txt ---"
          cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        id: gh_release
        with:
          tag_name: ${{ github.ref_name }}
          name: The Pastor Bible ${{ needs.version.outputs.version }}
          draft: true
          body: |
            The Pastor Bible ${{ needs.version.outputs.version }}, unsigned.

            **Windows is unchanged in this release.** Nothing about the Windows
            installer, the upgrade flow or the program itself was altered; the
            only shared file that changed is the build workflow.

            **macOS is new here, and no person has run it on a Mac yet.**
            Everything that can be proven by a machine has been: both disk
            images are built, tested and asked a real question end to end on
            GitHub's own Apple Silicon and Intel runners. Nothing about how it
            *looks* on a Mac has been seen by anybody. Take the file labelled
            for your chip, and read READ ME FIRST inside the disk image before
            you double-click: macOS will refuse to open an unsigned app the
            first time, and that file has the exact steps for your version.

            Windows will show "Windows protected your PC" when you run the
            installer, because this project has no paid signing certificate yet.
            Click "More info", then "Run anyway". The README's install section
            has pictures of both of those screens.

            **Bible index**

                index_version 0.2.0
                sha256        ${{ env.INDEX_SHA256 }}
                bytes         ${{ env.INDEX_BYTES }}

            Installer checksums are in `SHA256SUMS.txt` beside the files.

            The answering model is not a release asset: it is about 5 GB and the
            app downloads it once, on first run, from the model's own host, with
            its checksum pinned in the program.
          files: release/*

      # The release page lists four files whose names mean nothing to a reader
      # who is not a programmer. GitHub shows an asset's *label* instead of its
      # name when one is set, so each asset gets a plain-words label saying what
      # it is for. The file itself is untouched: the name, the bytes and the
      # checksum are exactly what SHA256SUMS.txt records, and the label is only
      # what the page prints above the download link. Set on v1.0.0, v1.0.1 and
      # v1.0.2 by hand in P7-close-prep; done here so no later release needs it.
      #
      # softprops/action-gh-release cannot set labels, and the release is a
      # draft, so the assets are found by the release id the action returns
      # rather than by tag.
      - name: label the assets in plain words
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ steps.gh_release.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets" \
            --jq '.[] | "\(.id)|\(.name)"' |
          while IFS='|' read -r id name; do
            case "$name" in
              *.exe)       label="Windows installer — most people want this one ($name)" ;;
              *aarch64.dmg) label="Mac installer — Apple Silicon (M1–M4, 2021 and newer) — unsigned, see install steps ($name)" ;;
              *x64.dmg)    label="Mac installer — Intel Macs, pre-2021 — unsigned, see install steps ($name)" ;;
              *.deb)       label="Linux installer for Ubuntu and Debian (.deb)" ;;
              *.AppImage)  label="Linux portable app for any distribution (.AppImage)" ;;
              SHA256SUMS*) label="Checksums for verifying your download (SHA256SUMS.txt)" ;;
              *) echo "no label rule for $name"; continue ;;
            esac
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/assets/$id" \
              -f label="$label" --jq '"\(.name) -> \(.label)"'
          done
